<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | DublinBusNet</title>
  <style>
    body { margin:0; font-family: 'Segoe UI', Tahoma, sans-serif; background:#0b2348; color:#f8fafc; }
    .shell { max-width: 960px; margin: 0 auto; padding: 72px 24px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
    .brand { font-weight:700; letter-spacing:0.4px; }
    nav a { color:#e2e8f0; text-decoration:none; margin-left:14px; font-weight:600; }
    nav a:hover { color:#fff; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:16px; }
    .card { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:20px; box-shadow:0 12px 30px rgba(0,0,0,0.28); }
    .name { font-weight:700; margin-bottom:6px; }
    .role { color:#cbd5e1; }
    footer { margin-top:32px; font-size:0.95rem; color:#cbd5e1; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">DublinBusNet</div>
      <nav>
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>
    <h1>Contact</h1>
    <div class="grid">
      <div class="card">
        <div class="name">Fred</div>
        <div class="role">Frontend</div>
      </div>
      <div class="card">
        <div class="name">Anush</div>
        <div class="role">Backend</div>
      </div>
      <div class="card">
        <div class="name">Ruhao</div>
        <div class="role">Data &amp; Analytics</div>
      </div>
    </div>
    <footer>
      Reach out to our team for collaboration or support.
    </footer>
  </div>
</body>
</html>
