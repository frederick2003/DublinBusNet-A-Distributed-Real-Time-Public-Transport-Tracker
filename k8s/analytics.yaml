apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: dublinbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: dublinbus-analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "4000"
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 8
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: dublinbus
spec:
  selector:
    app: analytics
  ports:
    - name: http
      port: 4000
      targetPort: 4000
